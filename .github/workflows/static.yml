name: Publish EEZ Studio Manual
run-name: Publish EEZ Studio Manual

on:
  push:
    branches: [main]
    paths:
      - eez-studio-ru.zip
      - .github/workflows/static.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pages
        uses: actions/configure-pages@v6.0.0
      - name: Unpack the manual
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath eez-studio-ru.zip -DestinationPath site
          if (!(Test-Path -LiteralPath site/index.html -PathType Leaf)) {
            throw 'The manual archive is missing its root index.html.'
          }
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
